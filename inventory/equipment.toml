[[superseded]]
label = "All-Clad mixing bowl, 5qt"
was = "Oils bowl for large batches"
eras = "Batch #3"
replaced_by = "6qt stockpot"

[[superseded]]
label = "Mac chef knife"
was = "Cutting the loaf at ~3cm"
eras = "Batches #1, #3"
replaced_by = "MoldMarket miter box + bench scraper"
why = "Freehand cuts drift. The miter box fixes thickness at 1\" or 2\"."

[[superseded]]
label = "Nurture Handmade soap cutter wires (5 pack)"
was = "Cutting the 18\" loaf at 3cm"
eras = "Batch #4"
replaced_by = "MoldMarket miter box + bench scraper"
why = """
Cleaner than the knife on a long loaf, but still freehand on thickness. The miter box supersedes it \
and changed the house cut from 3cm to 1\"."""
