behavior = """
No acceleration. High vanillin — bars brown to dark tan/brown over cure. Cosmetic and expected; \
plan the look around it rather than fighting it."""
scent = "Creamy, sophisticated vanilla liqueur — less sweet than Vanilla Select."
status = "nearly spent"

