# Fragrance and essential oils on hand.
#
# `initial_g` plus the `used` ledger is AUTHORITATIVE; `remaining_g` is derived from them and
# exists so a human can read the file without doing arithmetic. `tools/lye.ts --self-check`
# re-derives every one and fails on a mismatch.
#
# This structure answers a real failure: Batch #5's ~11g of Sensuous Sandalwood went unrecorded
# for three weeks because "remaining" was a hand-edited number with nothing to check it against.
# A ledger entry per batch cannot silently disagree with itself. `retro` appends to `used` at pour
# and never touches `remaining_g` by hand.
#
# `vanillin` and `max_usage_pct` are qualitative or unknown where the supplier figure was never
# recorded. An unknown is left unknown — a guessed number here is worse than a blank, because it
# looks measured.

[fragrances.now-cedarwood-virginian]
label = "Cedarwood Virginian"
brand = "NOW Foods"
kind = "essential oil"
initial_g = 28 # 1 oz
used = [{ batch = 1, g = 22 }]
remaining_g = 6
vanillin = "none"
max_usage_pct = "unknown"
behavior = "Very lye-stable. No acceleration, no discoloration — what you pour is what you get."
scent = "Dry, woody, sharp. Works as an anchor under a brighter top note."

[fragrances.pt-eucalyptus-globulus]
label = "Eucalyptus Globulus"
brand = "Plant Therapy (Organic)"
kind = "essential oil"
initial_g = 27 # 30 ml
used = [{ batch = 1, g = 5 }]
remaining_g = 22
vanillin = "none"
max_usage_pct = "unknown"
behavior = "Lye-stable. No acceleration, no discoloration."
scent = "Clean, crisp top note. Use sparingly — it dominates fast."

